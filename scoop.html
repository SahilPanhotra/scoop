<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoop. — Scoops of Happiness</title>
<meta name="description" content="Handcrafted ice cream made with the finest ingredients. Scoops of happiness, delivered with love.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,600;1,9..144,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SCOOP. — 1:1 recreation
   ============================================================ */
:root{
  --yellow:#FFD45C;
  --yellow-2:#FFDF82;
  --cream:#FFF8EF;
  --pink:#FBD9E2;
  --mint:#CFEDD6;
  --green:#DDF0D8;
  --choc:#3E2723;
  --choc-70:rgba(62,39,35,.72);
  --choc-45:rgba(62,39,35,.48);
  --caramel:#C97B2D;
  --paper:#FFFDF8;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{
  background:var(--cream);color:var(--choc);
  font:400 15px/1.7 Poppins,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,92vw);margin-inline:auto}
section{position:relative}

h1,h2,.display{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.04}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 32px;border-radius:999px;border:2px solid transparent;
  font:600 14px/1 Poppins;letter-spacing:.01em;cursor:pointer;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s,color .3s,border-color .3s;
  will-change:transform;
}
.btn:hover{transform:translateY(-3px)}
.btn.solid{background:var(--choc);color:#FFF3E0}
.btn.solid:hover{box-shadow:0 16px 30px -12px rgba(62,39,35,.45)}
.btn.white{background:#fff;color:var(--choc)}
.btn.white:hover{box-shadow:0 16px 30px -12px rgba(62,39,35,.3)}
.btn.outline{border-color:#fff;color:#fff;background:transparent}
.btn.outline:hover{background:rgba(255,255,255,.14)}

.line{display:block;overflow:hidden;padding-bottom:.09em;margin-bottom:-.09em}
.line>span{display:block;transform:translateY(112%);will-change:transform}
[data-reveal]{opacity:0;transform:translateY(30px);will-change:transform,opacity}
.no-js .line>span{transform:none}
.no-js [data-reveal]{opacity:1;transform:none}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position:fixed;top:18px;left:0;right:0;z-index:60;
  display:flex;justify-content:center;pointer-events:none;
}
.nav-pill{
  pointer-events:auto;width:min(1060px,94vw);
  display:flex;align-items:center;justify-content:space-between;gap:26px;
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 18px 40px -18px rgba(62,39,35,.28);
  border-radius:999px;padding:10px 12px 10px 26px;
}
.nav-logo{font-family:Fraunces,serif;font-style:italic;font-weight:700;font-size:27px;letter-spacing:-.01em}
.nav-links{display:flex;align-items:center;gap:34px}
.nav-links a{
  position:relative;font:500 14px/1 Poppins;color:var(--choc);padding:6px 2px;
}
.nav-links a::after{
  content:"";position:absolute;left:50%;bottom:-2px;width:0;height:2.5px;border-radius:2px;
  background:var(--caramel);transform:translateX(-50%);transition:width .35s var(--ease);
}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-order{
  padding:12px 26px;border-radius:999px;background:var(--choc);color:#FFF3E0;
  font:600 13px/1 Poppins;transition:transform .3s var(--ease),box-shadow .3s;
}
.nav-order:hover{transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(62,39,35,.5)}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  min-height:100svh;display:flex;align-items:center;
  background:var(--cream); /* neutral base; tint layer owns the color */
  padding:150px 0 90px;overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,#FFEDAE 0%,#FFD45C 78%,#FFC94A 100%);
  will-change:opacity;transition:none;
}
.hero-inner{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1.02fr .98fr;gap:40px;align-items:center;
}
.hero-copy .script{
  display:inline-block;font-family:Fraunces,serif;font-style:italic;font-weight:600;
  font-size:clamp(20px,2vw,26px);color:rgba(62,39,35,.85);margin-bottom:12px;
}
.hero-title{
  font-size:clamp(52px,5.9vw,82px);color:#fff;
  text-shadow:0 6px 30px rgba(190,120,20,.35);
}
.hero-sub{
  margin:24px 0 34px;max-width:46ch;
  color:#fff;font-size:15.5px;font-weight:500;
  text-shadow:0 1px 2px rgba(150,90,10,.35),0 2px 14px rgba(150,90,10,.35),0 0 26px rgba(150,90,10,.25);
}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap}

/* hero visual — rotating flavor cups */
.hero-visual{position:relative;justify-self:center;width:100%;max-width:520px;aspect-ratio:1/1}
.hero-cup{
  position:absolute;inset:0;border-radius:32px;overflow:hidden;
  box-shadow:0 40px 70px -30px rgba(140,80,10,.45);
  will-change:transform,opacity;opacity:0;visibility:hidden;
}
.hero-cup.is-active{opacity:1;visibility:visible}
.hero-cup img{width:100%;height:100%;object-fit:cover}
.chip-float{
  position:absolute;z-index:5;
  background:#fff;border-radius:14px;padding:11px 18px;
  font:600 12.5px/1 Poppins;color:var(--choc);white-space:nowrap;
  box-shadow:0 18px 36px -14px rgba(62,39,35,.35);
  display:flex;align-items:center;gap:9px;
  will-change:transform;
}
.chip-float .dot{width:9px;height:9px;border-radius:50%;background:var(--caramel);flex:none}
.chip-float.c1{top:7%;left:-7%}
.chip-float.c2{bottom:9%;right:-6%}

/* in-cup flavor chips */
.cup-chip{
  position:absolute;z-index:4;
  background:rgba(255,255,255,.94);border-radius:999px;padding:9px 16px;
  font:600 11.5px/1 Poppins;letter-spacing:.02em;color:var(--choc);white-space:nowrap;
  box-shadow:0 14px 30px -12px rgba(62,39,35,.4);
  will-change:transform,opacity;
}
.cup-chip.cc1{top:16%;left:-4%}
.cup-chip.cc2{top:44%;right:-5%}
.cup-chip.cc3{bottom:14%;left:2%}

/* hero flavor dots */
.hero-dots{display:flex;gap:11px;margin-top:38px}
.hdot{
  width:11px;height:11px;border-radius:999px;border:0;cursor:pointer;padding:0;
  background:rgba(255,255,255,.45);
  transition:width .4s var(--ease),background .4s,transform .3s;
  will-change:width;
}
.hdot:hover{transform:scale(1.2)}
.hdot.is-on{width:34px;background:#fff}
</style>
</head>
